<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEX Dev-First Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161e2d;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --danger-color: #f43f5e;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --border-color: #2e3b4e;
            --critical-bg: rgba(244, 63, 94, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: rgba(22, 30, 45, 0.8);
            backdrop-filter: blur(12px);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-summary {
            display: flex;
            gap: 2rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .stat-value.danger {
            color: var(--danger-color);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .toolbar {
            background: #1e293b;
            padding: 1rem 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }

        .main-content {
            padding: 2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 1.25rem;
            padding: 1.75rem;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card.affected {
            border-left: 5px solid var(--danger-color);
            background: linear-gradient(135deg, var(--critical-bg) 0%, var(--card-bg) 100%);
        }

        .badge {
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 0.4rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .severity-CRITICAL {
            background: #fee2e2;
            color: #991b1b;
        }

        .severity-HIGH {
            background: #ffedd5;
            color: #9a3412;
        }

        .severity-MEDIUM {
            background: #fef9c3;
            color: #854d0e;
        }

        .severity-LOW {
            background: #dcfce7;
            color: #166534;
        }

        .status-badge {
            float: right;
            border: 1px solid currentColor;
            background: transparent;
        }

        .cve-id {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            display: block;
        }

        .description {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .analysis-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 1.25rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .box-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-color);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .justification-text {
            font-size: 0.9rem;
            font-style: italic;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }

        .comment-input {
            width: 100%;
            background: #0b0f19;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-family: inherit;
            font-size: 0.9rem;
            min-height: 80px;
            box-sizing: border-box;
            margin-top: 0.5rem;
        }

        .comment-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .actions {
            margin-top: 2rem;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .file-controls {
            display: flex;
            gap: 1rem;
        }

        input[type="file"] {
            display: none;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 10rem 0;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        /* Animation */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: slideUp 0.3s ease-out forwards;
        }
    </style>
</head>

<body>

    <header>
        <div>
            <h1 style="color: var(--text-primary); margin: 0; font-size: 1.2rem;">DevSecOps <span
                    style="color: var(--accent-color)">Triage</span></h1>
            <p style="color: var(--text-secondary); font-size: 0.8rem; margin: 0;">Resilience-First Vulnerability
                Management</p>
        </div>

        <div class="stats-summary" id="statsHeader">
            <div class="stat-item">
                <span class="stat-value" id="fileTimestamp">--:--</span>
                <span class="stat-label">File Timestamp (UTC)</span>
            </div>
            <div class="stat-item">
                <span class="stat-value danger" id="actionRequiredCount">0</span>
                <span class="stat-label">Action Required</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="triagedCount">0</span>
                <span class="stat-label">Triaged (Safe)</span>
            </div>
        </div>

        <div class="file-controls">
            <label for="vexFile" class="btn btn-outline">Load VEX</label>
            <input type="file" id="vexFile" accept=".json">
            <button class="btn btn-primary" id="saveBtn" style="display: none;">Save VEX</button>
        </div>
    </header>

    <div class="toolbar">
        <button class="tab-btn active" data-filter="action">Action Required</button>
        <button class="tab-btn" data-filter="triaged">Triage History</button>
        <button class="tab-btn" data-filter="all">All Findings</button>
    </div>

    <div class="main-content">
        <div id="cardGrid" class="grid">
            <div class="empty-state">
                <svg fill="currentColor" viewBox="0 0 20 20">
                    <path
                        d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z">
                    </path>
                </svg>
                <p>Nessun record caricato. Seleziona <code>vex.json</code> dalla barra superiore.</p>
            </div>
        </div>
    </div>

    <script>
        let currentData = null;
        let currentFilter = 'action';

        document.getElementById('vexFile').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    currentData = JSON.parse(e.target.result);
                    updateStats();
                    render();
                    document.getElementById('saveBtn').style.display = 'block';
                } catch (err) { alert('Invalid VEX file'); }
            };
            reader.readAsText(file);
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                render();
            });
        });

        function updateStats() {
            const vulnerabilities = currentData.vulnerabilities || [];
            const actionRequired = vulnerabilities.filter(v =>
                !v.analysis || v.analysis.state === 'affected' || v.analysis.state === 'under_investigation'
            ).length;
            const triaged = vulnerabilities.length - actionRequired;

            document.getElementById('actionRequiredCount').textContent = actionRequired;
            document.getElementById('triagedCount').textContent = triaged;

            // Update file timestamp from metadata
            if (currentData.metadata && currentData.metadata.timestamp) {
                const ts = currentData.metadata.timestamp;
                // Just show the time part for quick reading
                const timePart = ts.split('T')[1].split('Z')[0];
                document.getElementById('fileTimestamp').textContent = timePart;
            }
        }

        function getSeverity(vuln) {
            if (vuln.ratings && vuln.ratings.length > 0) {
                return vuln.ratings[0].severity || 'NOT RATED';
            }
            return 'UNKNOWN';
        }

        function render() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';

            if (!currentData) return;

            let allVulns = currentData.vulnerabilities || [];

            // Render vulnerabilities directly (no deduplication to match Dependency-Track)
            let filteredVulns = allVulns;
            if (currentFilter === 'action') {
                filteredVulns = allVulns.filter(v =>
                    !v.analysis || v.analysis.state === 'affected' ||
                    v.analysis.state === 'under_investigation' || v.analysis.state === 'exploitable' || v.analysis.state === 'in_triage'
                );
            } else if (currentFilter === 'triaged') {
                filteredVulns = allVulns.filter(v => v.analysis && v.analysis.state === 'not_affected');
            }

            if (filteredVulns.length === 0) {
                grid.innerHTML = `<div class="empty-state"><p>Nessuna vulnerabilità trovata per questo filtro.</p></div>`;
                return;
            }

            // Render cards
            filteredVulns.forEach((vuln) => {
                const severity = getSeverity(vuln);
                const state = (vuln.analysis && vuln.analysis.state) || 'under_investigation';
                const card = document.createElement('div');
                card.className = `card ${['affected', 'exploitable', 'in_triage'].includes(state) ? 'affected' : ''}`;

                card.innerHTML = `
                    <div>
                        <span class="badge severity-${severity.toUpperCase()}">${severity}</span>
                        <span class="badge status-badge">${state.replace(/_/g, ' ')}</span>
                    </div>
                    <span class="cve-id">${vuln.id}</span>
                    <p class="description">${vuln.description || 'Nessuna descrizione disponibile.'}</p>
                    
                    <div class="analysis-box">
                        <div class="box-title">AI Triage Details</div>
                        <div class="justification-text">${(vuln.analysis && vuln.analysis.justification) || 'Nessuna analisi automatizzata.'}</div>
                        
                        <div class="box-title">Developer Notes / Evidence</div>
                        <textarea class="comment-input" data-id="${vuln.id}" placeholder="Inserisci commento per il team security...">${(vuln.analysis && vuln.analysis.detail) || ''}</textarea>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.querySelectorAll('.comment-input').forEach(input => {
                input.addEventListener('change', function () {
                    const vulnId = this.dataset.id;
                    const vuln = currentData.vulnerabilities.find(v => v.id === vulnId);
                    if (vuln) {
                        if (!vuln.analysis) vuln.analysis = { state: 'under_investigation' };
                        vuln.analysis.detail = this.value;
                    }
                });
            });
        }

        document.getElementById('saveBtn').addEventListener('click', function () {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentData, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", "vex.json");
            dl.click();
        });
    </script>
</body>

</html>
