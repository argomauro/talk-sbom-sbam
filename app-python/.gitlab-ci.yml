stages:
  - scan
  - sync

# 1. Generazione dello SBOM
generate_sbom:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --format cyclonedx --output bom.json .
  artifacts:
    paths:
      - bom.json

# 2. Sincronizzazione Consolidata (SBOM + VEX)
dtrack_sync:
  stage: sync
  image: alpine:latest
  before_script:
    - apk add --no-cache curl git sed
  script:
    - |
      set -e
      DT_URL="http://host.docker.internal:8081"

      echo "--- 1. Caricamento SBOM ---"
      UPLOAD_TOKEN=$(curl -f -s -X "POST" "$DT_URL/api/v1/bom" \
           -H 'Content-Type: multipart/form-data' \
           -H "X-Api-Key: $DT_API_KEY" \
           -F "projectName=$CI_PROJECT_NAME" \
           -F "projectVersion=$CI_COMMIT_BRANCH" \
           -F "autoCreate=true" \
           -F "bom=@bom.json" | sed -E 's/.*"token":"([^"]+)".*/\1/')

      echo "Upload completato (Token: $UPLOAD_TOKEN). In attesa dell'analisi..."
      # Polling per attendere la fine dell'elaborazione
      for i in $(seq 1 30); do
        PROCESSING=$(curl -f -s -X "GET" "$DT_URL/api/v1/bom/token/$UPLOAD_TOKEN" \
             -H "X-Api-Key: $DT_API_KEY" | grep -o '"processing":true' || true)
        if [ -z "$PROCESSING" ]; then
          echo "Analisi completata con successo."
          break
        fi
        echo "Ancora in elaborazione... ($i/30)"
        sleep 5
      done

      echo "--- 2. Recupero UUID Progetto ---"
      PROJECT_UUID=$(curl -f -s -G "$DT_URL/api/v1/project" \
           -H "X-Api-Key: $DT_API_KEY" \
           --data-urlencode "name=$CI_PROJECT_NAME" \
           --data-urlencode "version=$CI_COMMIT_BRANCH" | sed -E 's/.*"uuid":"([^"]+)".*/\1/')

      if [ -z "$PROJECT_UUID" ]; then
        echo "ERRORE: Impossibile trovare l'UUID del progetto."
        exit 1
      fi
      echo "Project UUID: $PROJECT_UUID"

      echo "--- 3. Analisi VEX (Enrichment vs Baseline) ---"
      # Verifica se il file vex.json è stato modificato in questo push (arricchimento manuale/AI)
      VEX_MODIFIED=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA | grep vex.json || true)

      if [ -n "$VEX_MODIFIED" ]; then
        echo "Rilevato arricchimento in vex.json. Invio del VEX arricchito a Dependency-Track..."
        curl -f -X "POST" "$DT_URL/api/v1/vex" \
             -H 'Content-Type: multipart/form-data' \
             -H "X-Api-Key: $DT_API_KEY" \
             -F "projectName=$CI_PROJECT_NAME" \
             -F "projectVersion=$CI_COMMIT_BRANCH" \
             -F "vex=@vex.json"
      else
        echo "Nessun arricchimento locale. Sincronizzazione baseline da Dependency-Track..."
        curl -f -s -X "GET" "$DT_URL/api/v1/vex/cyclonedx/project/$PROJECT_UUID" \
             -H "X-Api-Key: $DT_API_KEY" \
             -H "Accept: application/vnd.cyclonedx+json" \
             -o vex_latest.json

        if [ ! -f vex.json ] || [ "$(diff -q vex.json vex_latest.json || true)" != "" ]; then
          echo "Aggiornamento vex.json con la baseline del server..."
          mv vex_latest.json vex.json
          git config --global user.email "ci-bot@example.com"
          git config --global user.name "VEX CI Bot"
          git remote set-url origin "http://oauth2:${CI_GIT_TOKEN}@host.docker.internal/${CI_PROJECT_PATH}.git"
          git add vex.json
          git commit -m "chore: auto-update VEX baseline [skip ci]"
          git push origin HEAD:$CI_COMMIT_BRANCH
        else
          echo "Il file vex.json è già allineato alla baseline."
        fi
      fi
  artifacts:
    paths:
      - vex.json
