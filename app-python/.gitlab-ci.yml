include:
  - project: 'demo-security/vex-engine'
    file: 'ci-template.yml'
    ref: main

stages:
  - scan
  - upload-bom
  - analyze
  - sync-vex

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — SCAN: Trivy genera il BOM
# ─────────────────────────────────────────────────────────────────────────────
generate_sbom:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --format cyclonedx --output bom.json .
  artifacts:
    paths:
      - bom.json

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — UPLOAD BOM: carica su DTrack e attende elaborazione + VEX
# ─────────────────────────────────────────────────────────────────────────────
upload_bom:
  stage: upload-bom
  image: alpine:latest
  needs: ["generate_sbom"]
  before_script:
    - apk add --no-cache curl sed
  script:
    - |
      set -e
      DT_URL="http://host.docker.internal:8081"

      echo "━━━ [1/2] Caricamento BOM su Dependency-Track ━━━"
      UPLOAD_TOKEN=$(curl -f -s -X "POST" "$DT_URL/api/v1/bom" \
        -H 'Content-Type: multipart/form-data' \
        -H "X-Api-Key: $DT_API_KEY" \
        -F "projectName=$CI_PROJECT_NAME" \
        -F "projectVersion=$CI_COMMIT_BRANCH" \
        -F "autoCreate=true" \
        -F "bom=@bom.json" | sed -E 's/.*"token":"([^"]+)".*/\1/')

      [ -z "$UPLOAD_TOKEN" ] && echo "ERRORE: token upload non ricevuto." && exit 1
      echo "Upload token: $UPLOAD_TOKEN"

      echo "━━━ [2/2] Attesa elaborazione BOM ━━━"
      for i in $(seq 1 30); do
        PROCESSING=$(curl -f -s "$DT_URL/api/v1/bom/token/$UPLOAD_TOKEN" \
          -H "X-Api-Key: $DT_API_KEY" | grep -o '"processing":true' || true)
        if [ -z "$PROCESSING" ]; then
          echo "BOM elaborato ($i/30)."
          break
        fi
        echo "In elaborazione... ($i/30)" && sleep 5
      done
  artifacts:
    paths:
      - bom.json

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — ANALYZE: iniettato da vex-engine/ci-template.yml
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4 — SYNC VEX: carica il VEX arricchito su Dependency-Track
# ─────────────────────────────────────────────────────────────────────────────
sync_vex:
  stage: sync-vex
  image: alpine:latest
  needs: ["vex_ai_analysis"]
  before_script:
    - apk add --no-cache curl
  script:
    - |
      set -e
      DT_URL="http://host.docker.internal:8081"

      [ ! -f vex.json ] && echo "vex.json non trovato — skip." && exit 0

      echo "━━━ Caricamento VEX arricchito su Dependency-Track ━━━"
      RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X "POST" "$DT_URL/api/v1/vex" \
        -H 'Content-Type: multipart/form-data' \
        -H "X-Api-Key: $DT_API_KEY" \
        -F "projectName=$CI_PROJECT_NAME" \
        -F "projectVersion=$CI_COMMIT_BRANCH" \
        -F "vex=@vex.json")
      echo "$RESPONSE"
      HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
      [ "$HTTP_CODE" = "200" ] && echo "VEX caricato." || (echo "ERRORE DTrack: HTTP $HTTP_CODE" && exit 1)
  artifacts:
    paths:
      - vex.json
